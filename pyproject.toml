[project]
name = "traceguard"
version = "0.1.0"
description = "Agentic, graph-native fraud investigation platform powered by TigerGraph."
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]