<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TraceGuard</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171e27;
      --line: #2a3544;
      --text: #e7eef7;
      --muted: #8ea0b5;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --bad: #ff6b6b;
      --warn: #f5c542;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
    header {
      display: flex; align-items: baseline; gap: 12px;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; }
    header p { margin: 0; color: var(--muted); }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100% - 57px); }
    aside { border-right: 1px solid var(--line); overflow: auto; }
    .case {
      width: 100%; text-align: left; background: transparent; color: inherit;
      border: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; cursor: pointer;
    }
    .case:hover, .case.active { background: var(--panel); }
    .case strong { display: block; }
    .case span { color: var(--muted); font-size: 12px; }
    main { overflow: auto; padding: 20px 24px 48px; }
    .empty { color: var(--muted); margin-top: 48px; }
    .banner { display: flex; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: 16px; margin-bottom: 16px; }
    .verdict { font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .verdict.legitimate { color: var(--ok); }
    .verdict.fraud { color: var(--bad); }
    .verdict.uncertain { color: var(--warn); }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 24px 0 8px; }
    ul { margin: 0; padding-left: 18px; }
    .actions li, .evidence li { margin-bottom: 8px; }
    .source { color: var(--muted); font-size: 12px; }
    .error { color: var(--bad); }
    button.run {
      background: var(--accent); color: #fff; border: 0; padding: 8px 14px; cursor: pointer;
    }
    button.run:disabled { opacity: 0.6; cursor: wait; }
    pre { background: #0b1015; border: 1px solid var(--line); padding: 12px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>TraceGuard</h1>
    <p>Investigate an exam case against graph facts, policy, and closed-case notes.</p>
  </header>
  <div class="layout">
    <aside id="cases"></aside>
    <main id="panel">
      <p class="empty">Select a case, then run the investigation. The first run can take a few seconds.</p>
    </main>
  </div>
  <script>
    const casesEl = document.getElementById("cases");
    const panel = document.getElementById("panel");
    let selected = null;

    function triggerLabel(item) {
      const score = item.risk_score == null ? "" : ` · ${item.risk_score.toFixed(2)}`;
      return `${item.trigger_type.replaceAll("_", " ")}${score}`;
    }

    function renderCases(items) {
      casesEl.innerHTML = "";
      items.forEach((item) => {
        const btn = document.createElement("button");
        btn.className = "case";
        btn.innerHTML = `<strong>${item.case_id}</strong><span>${triggerLabel(item)} · ${item.customer_id}</span>`;
        btn.onclick = () => selectCase(item, btn);
        casesEl.appendChild(btn);
      });
    }

    function selectCase(item, btn) {
      selected = item;
      [...casesEl.children].forEach((el) => el.classList.remove("active"));
      btn.classList.add("active");
      panel.innerHTML = `
        <p><strong>${item.case_id}</strong> · card ${item.card_id} · txn ${item.flagged_txn_id}</p>
        <p>${item.trigger_text}</p>
        <p><button class="run" id="run">Investigate</button></p>
        <p class="empty">No investigation yet.</p>
      `;
      document.getElementById("run").onclick = () => runInvestigation(item.case_id);
    }

    async function runInvestigation(caseId) {
      const run = document.getElementById("run");
      run.disabled = true;
      run.textContent = "Investigating…";
      try {
        const response = await fetch(`/investigate/${caseId}`, { method: "POST" });
        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: response.statusText }));
          throw new Error(err.detail || `HTTP ${response.status}`);
        }
        renderAnswer(await response.json());
      } catch (error) {
        panel.insertAdjacentHTML("beforeend", `<p class="error">${error.message}</p>`);
        run.disabled = false;
        run.textContent = "Investigate";
      }
    }

    function actionList(items) {
      return items.map((item) =>
        `<li><strong>${item.action}</strong> · ${item.route}<div class="source">${item.reason}</div></li>`
      ).join("");
    }

    function renderAnswer(answer) {
      const c = answer.case;
      panel.innerHTML = `
        <div class="banner">
          <div>
            <div class="verdict ${c.verdict}">${c.verdict}</div>
            <div>${answer.case_id} · ${c.status} · p=${c.fraud_probability.toFixed(2)} · ${c.pattern}</div>
          </div>
          <div>exposure $${c.exposure_usd.toFixed(2)} · SAR ${answer.sar.file ? "file" : "not filed"}</div>
        </div>
        <p>${c.summary}</p>
        <p>${answer.stop_reason}</p>
        <h2>Initial actions</h2>
        <ul class="actions">${actionList(answer.next_best_actions.initial)}</ul>
        <h2>Final actions</h2>
        <ul class="actions">${actionList(answer.next_best_actions.final)}</ul>
        <p class="source">${answer.next_best_actions.what_changed}</p>
        <h2>Evidence</h2>
        <ul class="evidence">${c.evidence.map((item) =>
          `<li>${item.claim}<div class="source">${item.source} · ${item.ref}</div></li>`
        ).join("")}</ul>
        <h2>Raw JSON</h2>
        <pre>${JSON.stringify(answer, null, 2)}</pre>
      `;
    }

    fetch("/cases")
      .then((res) => res.json())
      .then(renderCases)
      .catch((error) => { panel.innerHTML = `<p class="error">${error.message}</p>`; });
  </script>
</body>
</html>
