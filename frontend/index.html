<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TraceGuard</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171e27;
      --line: #2a3544;
      --text: #e7eef7;
      --muted: #8ea0b5;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --bad: #ff6b6b;
      --warn: #f5c542;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
    header {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; }
    header p { margin: 0; color: var(--muted); }
    .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100% - 57px); }
    aside { border-right: 1px solid var(--line); overflow: auto; }
    .case {
      width: 100%; text-align: left; background: transparent; color: inherit;
      border: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; cursor: pointer;
    }
    .case:hover, .case.active { background: var(--panel); }
    .case strong { display: block; }
    .case span { color: var(--muted); font-size: 12px; }
    main { overflow: auto; padding: 20px 24px 48px; }
    .empty { color: var(--muted); margin-top: 48px; }
    .banner {
      display: flex; gap: 16px; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line);
      padding: 16px; margin-bottom: 16px;
    }
    .verdict { font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .verdict.legitimate { color: var(--ok); }
    .verdict.fraud { color: var(--bad); }
    .verdict.uncertain { color: var(--warn); }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 24px 0 8px; }
    ul { margin: 0; padding-left: 18px; }
    .actions li, .evidence li { margin-bottom: 8px; }
    .source { color: var(--muted); font-size: 12px; }
    .error { color: var(--bad); }
    button.run {
      background: var(--accent); color: #fff; border: 0; padding: 8px 14px; cursor: pointer;
    }
    button.run:disabled { opacity: 0.6; cursor: wait; }
    pre { background: #0b1015; border: 1px solid var(--line); padding: 12px; overflow: auto; font-size: 12px; }
    details { margin-top: 24px; }
    details summary { cursor: pointer; color: var(--muted); }
    .console { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
    .panel-box { background: var(--panel); border: 1px solid var(--line); padding: 12px; min-height: 280px; }
    #graph { width: 100%; height: 320px; display: block; }
    .timeline { max-height: 320px; overflow: auto; }
    .timeline li { list-style: none; margin: 0 0 8px; padding: 8px; border-left: 3px solid var(--line); }
    .timeline { margin: 0; padding: 0; }
    .timeline li.flagged { border-color: var(--accent); }
    .timeline li.episode { border-color: var(--bad); }
    .route { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warn); }
    .route.auto { color: var(--ok); }
    .route.l2 { color: var(--bad); }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      aside { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); }
      .console { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TraceGuard</h1>
    <p>Investigate an exam case against graph facts, policy, and closed-case notes.</p>
    <p id="mode"></p>
  </header>
  <div class="layout">
    <aside id="cases"></aside>
    <main id="panel">
      <p class="empty">Select a case to open the saved exam answer. Investigate re-runs the live graph.</p>
    </main>
  </div>
  <script>
    const casesEl = document.getElementById("cases");
    const panel = document.getElementById("panel");
    let selected = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function triggerLabel(item) {
      const score = item.risk_score == null ? "" : ` · ${item.risk_score.toFixed(2)}`;
      return `${item.trigger_type.replaceAll("_", " ")}${score}`;
    }

    function listOrNone(ids) {
      if (!ids || !ids.length) return `<p class="source">None.</p>`;
      return `<ul>${ids.map((id) => `<li>${escapeHtml(id)}</li>`).join("")}</ul>`;
    }

    function actionList(items) {
      return items.map((item) =>
        `<li><strong>${escapeHtml(item.action)}</strong> · ${escapeHtml(item.route)}<div class="source">${escapeHtml(item.reason)}</div></li>`
      ).join("");
    }

    function requestList(items) {
      if (!items.length) return `<p class="source">None.</p>`;
      return `<ul class="evidence">${items.map((item) =>
        `<li>${escapeHtml(item.type)} after step ${escapeHtml(item.asked_after_step)}<div class="source">${escapeHtml(item.assumed_response)}</div></li>`
      ).join("")}</ul>`;
    }

    function sarBlock(sar) {
      if (!sar.file) {
        return `<p class="source">${escapeHtml(sar.reason)}</p>`;
      }
      const dates = (sar.activity_dates || []).join(" → ");
      return `
        <p>${escapeHtml(sar.reason)}</p>
        <p>${escapeHtml(sar.narrative)}</p>
        <p class="source">Subjects: ${escapeHtml((sar.subjects || []).join(", "))} · $${Number(sar.total_amount_usd).toFixed(2)} · ${escapeHtml(dates)}</p>
      `;
    }

    function renderCases(items) {
      casesEl.innerHTML = "";
      items.forEach((item) => {
        const btn = document.createElement("button");
        btn.className = "case";
        btn.innerHTML = `<strong>${escapeHtml(item.case_id)}</strong><span>${escapeHtml(triggerLabel(item))} · ${escapeHtml(item.customer_id)}</span>`;
        btn.onclick = () => selectCase(item, btn);
        casesEl.appendChild(btn);
      });
    }

    function selectCase(item, btn) {
      selected = item;
      [...casesEl.children].forEach((el) => el.classList.remove("active"));
      btn.classList.add("active");
      panel.innerHTML = `<p>Loading saved answer for ${escapeHtml(item.case_id)}…</p>`;
      Promise.all([
        fetch(`/cases/${encodeURIComponent(item.case_id)}`).then((res) => {
          if (!res.ok) {
            return res.json().then((err) => { throw new Error(err.detail || `HTTP ${res.status}`); });
          }
          return res.json();
        }),
        fetch(`/graph/${encodeURIComponent(item.case_id)}`).then((res) => res.ok ? res.json() : null).catch(() => null),
      ])
        .then(([answer, graph]) => renderAnswer(answer, "saved", graph))
        .catch((error) => {
          panel.innerHTML = `
            <p><strong>${escapeHtml(item.case_id)}</strong> · card ${escapeHtml(item.card_id)} · txn ${escapeHtml(item.flagged_txn_id)}</p>
            <p>${escapeHtml(item.trigger_text)}</p>
            <p class="error">${escapeHtml(error.message)}</p>
            <p><button class="run" id="run">Investigate</button></p>
          `;
          document.getElementById("run").onclick = () => runInvestigation(item.case_id);
        });
    }

    async function runInvestigation(caseId) {
      const run = document.getElementById("run");
      if (run) {
        run.disabled = true;
        run.textContent = "Investigating…";
      }
      try {
        const response = await fetch(`/investigate/${encodeURIComponent(caseId)}`, { method: "POST" });
        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: response.statusText }));
          throw new Error(err.detail || `HTTP ${response.status}`);
        }
        const answer = await response.json();
        const graph = await fetch(`/graph/${encodeURIComponent(caseId)}`).then((res) => res.ok ? res.json() : null).catch(() => null);
        renderAnswer(answer, "live", graph);
      } catch (error) {
        panel.insertAdjacentHTML("beforeend", `<p class="error">${escapeHtml(error.message)}</p>`);
        if (run) {
          run.disabled = false;
          run.textContent = "Investigate";
        }
      }
    }

    function renderAnswer(answer, source, graph) {
      const c = answer.case;
      const sourceLabel = source === "live" ? "Live investigation." : "Saved exam answer.";
      const graphWrite = c.written_to_graph
        ? `Written as ${c.graph_case_id}`
        : "Not written";
      const timeline = (graph && graph.timeline) || [];
      const approvals = (graph && graph.approvals) || answer.next_best_actions.final.map((item) => ({
        action: item.action, route: item.route, reason: item.reason,
      }));
      panel.innerHTML = `
        <div class="banner">
          <div>
            <div class="verdict ${escapeHtml(c.verdict)}">${escapeHtml(c.verdict)}</div>
            <div>${escapeHtml(answer.case_id)} · ${escapeHtml(c.status)} · p=${Number(c.fraud_probability).toFixed(2)} · ${escapeHtml(c.pattern)}</div>
          </div>
          <div>exposure $${Number(c.exposure_usd).toFixed(2)} · SAR ${answer.sar.file ? "file" : "not filed"}</div>
        </div>
        <p>${escapeHtml(c.summary)}</p>
        <p>${escapeHtml(answer.stop_reason)}</p>
        <p class="source">${sourceLabel} · ${escapeHtml(graphWrite)} · ${escapeHtml(answer.tool_calls)} graph hops</p>
        <p><button class="run" id="run">Investigate</button></p>
        <div class="console">
          <div class="panel-box">
            <h2>Neighborhood</h2>
            <svg id="graph" viewBox="0 0 640 320"></svg>
          </div>
          <div class="panel-box">
            <h2>Timeline</h2>
            <ul class="timeline">${timeline.map((row) => `
              <li class="${row.flagged ? "flagged" : ""} ${row.episode ? "episode" : ""}">
                <strong>${escapeHtml(row.ts)}</strong>
                · ${escapeHtml(row.txn_id)}
                · $${Number(row.amount).toFixed(2)}
                · ${escapeHtml(row.channel)}
                ${row.flagged ? "<span class='source'>flagged</span>" : ""}
              </li>`).join("") || "<li class='source'>No history loaded.</li>"}</ul>
          </div>
        </div>
        <h2>Approvals</h2>
        <ul class="actions">${approvals.map((item) =>
          `<li><span class="route ${escapeHtml(String(item.route).toLowerCase())}">${escapeHtml(item.route)}</span> <strong>${escapeHtml(item.action)}</strong><div class="source">${escapeHtml(item.reason)}</div></li>`
        ).join("")}</ul>
        <h2>Connected cards</h2>
        ${listOrNone(c.connected_card_ids)}
        <h2>Connected devices</h2>
        ${listOrNone(c.connected_device_profiles)}
        <h2>Similar prior cases</h2>
        ${listOrNone(c.similar_prior_cases)}
        <h2>Evidence requests</h2>
        ${requestList(answer.evidence_requests || [])}
        <h2>Initial actions</h2>
        <ul class="actions">${actionList(answer.next_best_actions.initial)}</ul>
        <h2>Final actions</h2>
        <ul class="actions">${actionList(answer.next_best_actions.final)}</ul>
        <p class="source">${escapeHtml(answer.next_best_actions.what_changed)}</p>
        <h2>Evidence</h2>
        <ul class="evidence">${c.evidence.map((item) =>
          `<li>${escapeHtml(item.claim)}<div class="source">${escapeHtml(item.source)} · ${escapeHtml(item.ref)}</div></li>`
        ).join("")}</ul>
        <h2>SAR</h2>
        ${sarBlock(answer.sar)}
        <h2>Graph write</h2>
        <p class="source">${escapeHtml(graphWrite)} · ${escapeHtml(answer.tool_calls)} hops · ${escapeHtml(answer.tokens)} tokens · ${escapeHtml(answer.latency_s)}s</p>
        <details>
          <summary>Raw JSON</summary>
          <pre>${escapeHtml(JSON.stringify(answer, null, 2))}</pre>
        </details>
      `;
      document.getElementById("run").onclick = () => runInvestigation(answer.case_id);
      if (graph) drawGraph(graph);
    }

    function drawGraph(graph) {
      const svg = document.getElementById("graph");
      if (!svg) return;
      const nodes = graph.nodes || [];
      const edges = graph.edges || [];
      const colors = {
        case: "#3d8bfd",
        card: "#3dd68c",
        customer: "#f5c542",
        txn: "#ff6b6b",
        device: "#9b8cff",
        email: "#6bcbef",
        region: "#8ea0b5",
        closed: "#d08a4c",
      };
      const width = 640;
      const height = 320;
      const cx = width / 2;
      const cy = height / 2;
      const radius = Math.min(width, height) / 2 - 48;
      const placed = nodes.map((node, index) => {
        const angle = (Math.PI * 2 * index) / Math.max(nodes.length, 1) - Math.PI / 2;
        return {
          ...node,
          x: cx + radius * Math.cos(angle),
          y: cy + radius * Math.sin(angle),
        };
      });
      const byId = Object.fromEntries(placed.map((node) => [node.id, node]));
      const lines = edges.map((edge) => {
        const src = byId[edge.from];
        const dst = byId[edge.to];
        if (!src || !dst) return "";
        return `<line x1="${src.x}" y1="${src.y}" x2="${dst.x}" y2="${dst.y}" stroke="#2a3544" stroke-width="1.5" />`;
      }).join("");
      const circles = placed.map((node) => `
        <g>
          <circle cx="${node.x}" cy="${node.y}" r="14" fill="${colors[node.type] || "#8ea0b5"}" />
          <text x="${node.x}" y="${node.y + 28}" text-anchor="middle" fill="#e7eef7" font-size="10">${escapeHtml((node.label || node.id).slice(0, 22))}</text>
        </g>
      `).join("");
      svg.innerHTML = lines + circles;
    }

    fetch("/cases")
      .then((res) => res.json())
      .then(renderCases)
      .catch((error) => { panel.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`; });

    fetch("/health")
      .then((res) => res.json())
      .then((health) => {
        const mode = document.getElementById("mode");
        if (mode) {
          mode.textContent = `Graph ${health.graph} · LLM ${health.llm}`;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
